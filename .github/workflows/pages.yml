name: pages

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo build --release
      - run: target/release/dkt site dkt.toml -o public
      - run: cp -r demos public/demos
      - run: |
          for theme in docs paper plain colours; do
            target/release/dkt site examples/themes/$theme.toml -o public/demos/themes/$theme
          done
      - name: Leave out the markers of the builds
        run: find public -name .dkt-site -delete
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
