name: ci

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cargo test
      - run: cargo clippy --all-targets -- -D warnings
      - if: matrix.os == 'ubuntu-latest'
        run: python3 scripts/notice.py --check

  linux:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      archive: ${{ steps.pack.outputs.archive }}
    steps:
      - uses: actions/checkout@v4
      - run: cargo build --release
      - id: pack
        run: |
          version=$(cargo pkgid | sed 's/.*#//')
          name="dkt-${version}-x86_64-linux"
          mkdir "$name"
          cp target/release/dkt LICENSE-MIT LICENSE-APACHE NOTICE README.md "$name/"
          tar czf "$name.tar.gz" "$name"
          echo "archive=$name.tar.gz" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: dkt-linux
          path: ${{ steps.pack.outputs.archive }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: linux
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dkt-linux
      - env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY"
          --prerelease --title "$GITHUB_REF_NAME" --generate-notes
          "${{ needs.linux.outputs.archive }}"
