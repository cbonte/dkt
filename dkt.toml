[site]
title = "dkt"
description = "Doc Kit: document tools in one binary. Render, format, index, check and publish documents, in Markdown, reStructuredText and other formats, that stay readable on GitHub."
base_url = "https://cbonte.github.io/dkt"
repo = "https://github.com/cbonte/dkt"
branch = "master"
static = "static"
previews = true

[[nav]]
name = "Home"
url = "/"
[[nav]]
name = "Commands"
url = "/commands/"
section = "commands"

[[nav]]
name = "Examples"
url = "/examples/"
section = "examples"

[[nav]]
name = "HAProxy demo"
url = "/demos/haproxy/"

[home]
template = "index.html"

[[section]]
name = "commands"
title = "Commands"
description = "One guide per command."
sidebar = true

[[section]]
name = "examples"
title = "Examples"
description = "What a page looks like, in several formats, themes and components."
sidebar = true

[[page]]
glob = "docs/*.md"
section = "commands"
order = ["cat", "fmt", "toc", "lint", "convert", "html", "site", "rst", "haproxy"]

[[page]]
glob = "examples/*.md"
section = "examples"
order = ["markdown", "formats", "widgets", "themes", "terminal"]

[[page]]
src = "examples/rst/api.rst"
url = "/examples/rst-sample/"
section = "examples"
title = "reStructuredText sample"

[[page]]
src = "examples/haproxy/excerpt.txt"
format = "haproxy"
url = "/examples/haproxy-sample/"
section = "examples"
title = "HAProxy sample"

[figures]
src = "/brand/{name}.svg"

[data]
install = "cargo install --path ."

[data.brand]
favicon = "/brand/favicon.svg"

[[asset]]
src = "brand"
url = "/brand"

[[asset]]
src = "examples/img"
url = "/img"
