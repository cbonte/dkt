[package]
name = "dkt"
description = "Doc Kit: render, format, lint and publish Markdown, reStructuredText and HAProxy documentation, in the terminal, as HTML and as static sites"
version = "0.3.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/cbonte/dkt"

[dependencies]
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
minijinja = { version = "2", features = ["loader"] }
serde = { version = "1", features = ["derive"] }
toml = "0.9"
syntect = { version = "5", default-features = false, features = [
    "default-syntaxes",
    "default-themes",
    "regex-fancy",
    "parsing",
    "dump-load",
] }
unicode-width = "0.2"
clap = { version = "4", features = ["derive", "string", "wrap_help"] }
clap_complete = "4.6"
clap_mangen = "0.3"
terminal_size = "0.4"
anyhow = "1"
serde_json = "1"
yaml-rust2 = { version = "0.13", default-features = false }

[profile.release]
lto = true
codegen-units = 1
strip = true
